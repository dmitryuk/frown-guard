name: Build and Release Frown Guard

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget libegl1

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Upload Linux artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Frown_Guard-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build macOS App & DMG
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Upload macOS artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Frown_Guard.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows EXE
        shell: cmd
        run: |
          build_win.bat

      - name: Upload Windows artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Frown_Guard.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
